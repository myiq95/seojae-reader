<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Lumina Reader</title>
    <!-- Web Fonts for Myungjo/Serif support (Google Fonts & Web Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- PDF.js & JSZip (for EPUB/DOCX/PDF parsing) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* 웹폰트 패밀리 정의 */
        .font-nanum-myeongjo { font-family: 'Nanum Myeongjo', 'KoPubWorld Batang', 'Batang', 'AppleMyungjo', serif; }
        .font-gowun-batang { font-family: 'Gowun Batang', 'Gungsuh', 'KoPubWorld Batang', serif; }
        .font-noto-serif { font-family: 'Noto Serif KR', 'Nanum Myeongjo', serif; }
        .font-sans-kr { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }

        /* Reader Dynamic Typography Styles */
        #reader-scroll-content {
            font-family: var(--reader-font-family, 'Nanum Myeongjo', serif);
            font-size: var(--reader-font-size, 18px);
            line-height: var(--reader-line-height, 1.85);
            letter-spacing: var(--reader-letter-spacing, -0.02em);
        }

        /* 문단 및 블록 스타일링 - 한 줄로 뭉개지는 현상 완전 차단 */
        .reader-chapter-title {
            display: block;
            font-size: 1.6em;
            font-weight: 800;
            margin-top: 2.5rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid rgba(156, 163, 175, 0.3);
            color: currentColor;
            line-height: 1.4;
            word-break: keep-all;
        }

        .reader-paragraph {
            display: block;
            margin-top: 1rem;
            margin-bottom: 1rem;
            text-align: justify;
            word-break: keep-all;
            overflow-wrap: break-word;
            text-indent: 0.5em;
        }

        .reader-dialogue {
            display: block;
            margin-top: 1.1rem;
            margin-bottom: 1.1rem;
            padding-left: 0.85rem;
            border-left: 3px solid rgba(99, 102, 241, 0.5);
            font-style: normal;
            font-weight: 500;
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        /* Hide Scrollbar cleanly */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Soft Gradient Background Texture */
        .bg-reader-paper { background-color: #fbf9f5; color: #2c2a29; }
        .bg-reader-sepia { background-color: #f4ecd8; color: #3d3224; }
        .bg-reader-dark { background-color: #121212; color: #d1d5db; }
        .bg-reader-nordic { background-color: #1a2332; color: #e2e8f0; }

        /* Floating Nav auto hide/show */
        .nav-transition {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
        }
        .nav-hidden {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }
        .nav-bottom-hidden {
            transform: translateY(100%);
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans-kr min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

    <!-- APP WRAPPER -->
    <div id="app" class="flex-1 flex flex-col min-h-screen max-w-md md:max-w-4xl mx-auto w-full bg-gray-900 shadow-2xl relative overflow-hidden">

        <!-- HEADER TOP (NAVBAR) -->
        <header id="top-nav" class="fixed top-0 left-0 right-0 max-w-md md:max-w-4xl mx-auto z-40 bg-gray-900/90 backdrop-blur-md border-b border-gray-800 px-4 py-3 flex items-center justify-between nav-transition">
            <div class="flex items-center space-x-3">
                <button id="btn-back" onclick="switchView('library')" class="hidden p-2 rounded-full hover:bg-gray-800 text-gray-300 transition-colors">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </button>
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-white font-bold text-lg shadow-lg">
                        L
                    </div>
                    <span class="font-bold text-lg tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-300">LUMINA</span>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <!-- Open Reader Settings Button (Only visible in reader) -->
                <button id="btn-reader-settings" onclick="toggleReaderSettingsModal()" class="hidden p-2 rounded-full hover:bg-gray-800 text-gray-300">
                    <i data-lucide="type" class="w-5 h-5"></i>
                </button>
                <!-- TOC Drawer Toggle -->
                <button id="btn-toc" onclick="toggleTOC()" class="hidden p-2 rounded-full hover:bg-gray-800 text-gray-300">
                    <i data-lucide="list" class="w-5 h-5"></i>
                </button>
                <!-- Privacy Lock Toggle -->
                <button id="btn-privacy" onclick="togglePrivacyMode()" class="p-2 rounded-full hover:bg-gray-800 text-gray-400 hover:text-indigo-400 transition-colors" title="프라이버시 모드">
                    <i data-lucide="shield" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <!-- MAIN VIEW CONTAINER -->
        <main class="flex-1 flex flex-col pt-14 pb-16 relative overflow-hidden">

            <!-- 1. HOME VIEW (SPLASH / QUICK START) -->
            <section id="view-home" class="flex-1 flex flex-col justify-between p-6 text-center z-10">
                <div class="my-auto space-y-6">
                    <div class="inline-flex p-4 rounded-3xl bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 shadow-inner mb-2">
                        <i data-lucide="book-open-check" class="w-16 h-16"></i>
                    </div>
                    <h1 class="text-3xl font-extrabold tracking-tight text-white sm:text-4xl">
                        몰입을 위한 최적의 독서 공간
                    </h1>
                    <p class="text-gray-400 text-sm leading-relaxed max-w-sm mx-auto">
                        텍스트, EPUB, PDF 등 모든 서적 파일을 완벽한 가독성과 미니멀한 인터페이스로 경험하세요.
                    </p>
                    <div class="pt-4 flex flex-col gap-3 max-w-xs mx-auto">
                        <button onclick="switchView('library')" class="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold shadow-lg shadow-indigo-500/25 hover:brightness-110 active:scale-95 transition-all flex items-center justify-center space-x-2">
                            <i data-lucide="book-marked" class="w-5 h-5"></i>
                            <span>내 서재로 이동</span>
                        </button>
                        <label class="w-full py-3.5 px-6 rounded-xl bg-gray-800 border border-gray-700 text-gray-200 font-medium hover:bg-gray-750 active:scale-95 transition-all cursor-pointer flex items-center justify-center space-x-2">
                            <i data-lucide="file-plus" class="w-5 h-5 text-indigo-400"></i>
                            <span>새 파일 바로 읽기</span>
                            <input type="file" id="input-home-file" accept=".txt,.epub,.pdf,.docx,.md,.html" class="hidden" onchange="handleFileImport(event)">
                        </label>
                    </div>
                </div>
                <div class="text-xs text-gray-500">
                    Lumina Reader v2.5 • Private Local Storage
                </div>
            </section>

            <!-- 2. LIBRARY VIEW (SHELF) -->
            <section id="view-library" class="hidden flex-1 p-4 flex flex-col space-y-4">
                <!-- Shelf Tabs -->
                <div class="flex items-center justify-between border-b border-gray-800 pb-2">
                    <div class="flex space-x-4">
                        <button id="tab-reading" onclick="setLibraryTab('reading')" class="pb-2 text-sm font-bold border-b-2 border-indigo-500 text-indigo-400">
                            읽고 있는 책 (<span id="count-reading">0</span>)
                        </button>
                        <button id="tab-completed" onclick="setLibraryTab('completed')" class="pb-2 text-sm font-medium border-b-2 border-transparent text-gray-400 hover:text-gray-200">
                            완독 (<span id="count-completed">0</span>)
                        </button>
                    </div>
                    <label class="p-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold flex items-center space-x-1 cursor-pointer transition-colors">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        <span>책 추가</span>
                        <input type="file" id="input-library-file" accept=".txt,.epub,.pdf,.docx,.md,.html" class="hidden" onchange="handleFileImport(event)">
                    </label>
                </div>

                <!-- Book List Container -->
                <div id="book-list" class="flex-1 overflow-y-auto space-y-3 pr-1 no-scrollbar">
                    <!-- Dynamic rendering here -->
                </div>
            </section>

            <!-- 3. CONTINUOUS SCROLL READER VIEW -->
            <section id="view-reader" class="hidden flex-1 relative flex flex-col h-full bg-reader-paper">
                <!-- Real Scroll View Container -->
                <div id="reader-scroll-view" class="flex-1 overflow-y-auto px-5 md:px-12 py-8 no-scrollbar scroll-smooth" onscroll="handleReaderScroll(this)">
                    <div id="reader-scroll-content" class="max-w-2xl mx-auto space-y-4 min-h-screen">
                        <!-- Content elements will be rendered cleanly here -->
                    </div>
                </div>

                <!-- TTS Bar overlay -->
                <div id="tts-bar" class="hidden absolute bottom-4 left-4 right-4 bg-gray-900/95 backdrop-blur border border-gray-700/80 rounded-2xl p-3 shadow-2xl text-white flex items-center justify-between z-30">
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <button id="btn-tts-play" onclick="toggleTTS()" class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center shrink-0">
                            <i data-lucide="play" class="w-5 h-5 text-white"></i>
                        </button>
                        <div class="text-xs truncate">
                            <div class="font-bold text-gray-200" id="tts-status">음성 읽기 준비</div>
                            <div class="text-gray-400 truncate" id="tts-snippet">...</div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2 shrink-0">
                        <select id="tts-rate" onchange="updateTTSSettings()" class="bg-gray-800 text-xs text-gray-200 rounded px-2 py-1 border border-gray-700">
                            <option value="0.8">0.8x</option>
                            <option value="1.0" selected>1.0x</option>
                            <option value="1.25">1.25x</option>
                            <option value="1.5">1.5x</option>
                        </select>
                        <button onclick="stopTTS()" class="p-1.5 text-gray-400 hover:text-white">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </section>

        </main>

        <!-- TOC DRAWER MODAL -->
        <div id="toc-drawer" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden transition-opacity" onclick="toggleTOC()">
            <div class="absolute right-0 top-0 bottom-0 w-3/4 max-w-sm bg-gray-900 border-l border-gray-800 p-5 flex flex-col shadow-2xl" onclick="event.stopPropagation()">
                <div class="flex items-center justify-between border-b border-gray-800 pb-3 mb-4">
                    <h3 class="font-bold text-lg text-white flex items-center gap-2">
                        <i data-lucide="list-tree" class="w-5 h-5 text-indigo-400"></i> 목차
                    </h3>
                    <button onclick="toggleTOC()" class="text-gray-400 hover:text-white">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                <div id="toc-list" class="flex-1 overflow-y-auto space-y-2 no-scrollbar text-sm">
                    <!-- TOC rendered here -->
                </div>
            </div>
        </div>

        <!-- READER SETTINGS MODAL -->
        <div id="settings-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4" onclick="toggleReaderSettingsModal()">
            <div class="w-full max-w-md bg-gray-900 border-t sm:border border-gray-800 rounded-t-2xl sm:rounded-2xl p-5 space-y-5 text-white shadow-2xl" onclick="event.stopPropagation()">
                <div class="flex items-center justify-between border-b border-gray-800 pb-3">
                    <h3 class="font-bold text-base flex items-center gap-2">
                        <i data-lucide="sliders" class="w-4 h-4 text-indigo-400"></i> 텍스트 및 서체 설정
                    </h3>
                    <button onclick="toggleReaderSettingsModal()" class="text-gray-400 hover:text-white">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>

                <!-- Font Family Selection -->
                <div class="space-y-2">
                    <label class="text-xs text-gray-400 font-semibold">글꼴 선택</label>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <button onclick="setFontFamily('Nanum Myeongjo')" class="btn-font-opt p-2.5 rounded-lg border border-gray-700 bg-gray-800 text-center font-nanum-myeongjo">나눔명조</button>
                        <button onclick="setFontFamily('Gowun Batang')" class="btn-font-opt p-2.5 rounded-lg border border-gray-700 bg-gray-800 text-center font-gowun-batang">고운바탕</button>
                        <button onclick="setFontFamily('Noto Serif KR')" class="btn-font-opt p-2.5 rounded-lg border border-gray-700 bg-gray-800 text-center font-noto-serif">노토명조</button>
                        <button onclick="setFontFamily('Noto Sans KR')" class="btn-font-opt p-2.5 rounded-lg border border-gray-700 bg-gray-800 text-center font-sans-kr">고딕 (Noto Sans)</button>
                    </div>
                </div>

                <!-- Font Size Slider -->
                <div class="space-y-1">
                    <div class="flex justify-between text-xs text-gray-400">
                        <span>글자 크기</span>
                        <span id="label-font-size" class="text-indigo-400 font-bold">18px</span>
                    </div>
                    <input type="range" id="input-font-size" min="13" max="32" value="18" oninput="updateTypographySettings()" class="w-full accent-indigo-500">
                </div>

                <!-- Line Height Slider -->
                <div class="space-y-1">
                    <div class="flex justify-between text-xs text-gray-400">
                        <span>줄간격</span>
                        <span id="label-line-height" class="text-indigo-400 font-bold">1.85</span>
                    </div>
                    <input type="range" id="input-line-height" min="1.3" max="2.6" step="0.05" value="1.85" oninput="updateTypographySettings()" class="w-full accent-indigo-500">
                </div>

                <!-- Letter Spacing Slider -->
                <div class="space-y-1">
                    <div class="flex justify-between text-xs text-gray-400">
                        <span>자간</span>
                        <span id="label-letter-spacing" class="text-indigo-400 font-bold">-0.02em</span>
                    </div>
                    <input type="range" id="input-letter-spacing" min="-0.08" max="0.1" step="0.01" value="-0.02" oninput="updateTypographySettings()" class="w-full accent-indigo-500">
                </div>

                <!-- Theme Colors -->
                <div class="space-y-2">
                    <label class="text-xs text-gray-400 font-semibold">배경 테마</label>
                    <div class="grid grid-cols-4 gap-2 text-xs">
                        <button onclick="setTheme('paper')" class="p-3 rounded-lg bg-reader-paper text-gray-900 font-bold text-center border border-gray-300">페이퍼</button>
                        <button onclick="setTheme('sepia')" class="p-3 rounded-lg bg-reader-sepia text-yellow-950 font-bold text-center border border-amber-300">세피아</button>
                        <button onclick="setTheme('dark')" class="p-3 rounded-lg bg-reader-dark text-gray-200 font-bold text-center border border-gray-700">다크</button>
                        <button onclick="setTheme('nordic')" class="p-3 rounded-lg bg-reader-nordic text-slate-200 font-bold text-center border border-slate-600">노르딕</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- BOTTOM FIXED NAVIGATION BAR -->
        <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 max-w-md md:max-w-4xl mx-auto z-40 bg-gray-900/90 backdrop-blur-md border-t border-gray-800 px-6 py-2.5 flex items-center justify-around nav-transition">
            <button onclick="switchView('home')" class="nav-item flex flex-col items-center text-gray-400 hover:text-indigo-400 transition-colors" data-target="home">
                <i data-lucide="home" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1">홈</span>
            </button>
            <button onclick="switchView('library')" class="nav-item flex flex-col items-center text-gray-400 hover:text-indigo-400 transition-colors" data-target="library">
                <i data-lucide="library" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1">서재</span>
            </button>
            <button id="btn-nav-reader" onclick="switchView('reader')" class="nav-item flex flex-col items-center text-gray-400 hover:text-indigo-400 transition-colors" data-target="reader">
                <i data-lucide="book-open" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1">리더</span>
            </button>
            <button onclick="toggleTTSBar()" class="flex flex-col items-center text-gray-400 hover:text-indigo-400 transition-colors">
                <i data-lucide="volume-2" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1">TTS</span>
            </button>
        </nav>

        <!-- PRIVACY OVERLAY (SAFE SHIELD) -->
        <div id="privacy-overlay" class="hidden absolute inset-0 z-50 bg-gray-950 flex flex-col items-center justify-center p-6 text-center">
            <i data-lucide="lock" class="w-12 h-12 text-indigo-500 mb-3 animate-bounce"></i>
            <h2 class="text-xl font-bold text-white mb-1">프라이버시 보호 상태</h2>
            <p class="text-xs text-gray-400 mb-6">화면이 보호 상태입니다. 터치하여 해제하세요.</p>
            <button onclick="togglePrivacyMode()" class="px-5 py-2.5 rounded-full bg-indigo-600 text-white text-xs font-semibold shadow-lg">
                보호 해제하기
            </button>
        </div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Set up PDF.js worker
        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }

        // --- APP STATE ---
        const state = {
            currentView: 'home',
            libraryTab: 'reading',
            books: [], // { id, title, contentBlocks: [], toc: [], scrollRatio: 0, completed: false, lastRead: Date }
            currentBookId: null,
            settings: {
                fontFamily: 'Nanum Myeongjo',
                fontSize: 18,
                lineHeight: 1.85,
                letterSpacing: -0.02,
                theme: 'paper'
            },
            privacyMode: false,
            tts: {
                synth: window.speechSynthesis,
                utterance: null,
                speaking: false,
                rate: 1.0,
                blockIndex: 0
            },
            lastScrollTop: 0
        };

        // --- INITIALIZATION ---
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            loadStateFromStorage();
            applySettingsToCSS();
            renderLibrary();
            setupScrollBehavior();
        });

        // --- STORAGE ENGINE ---
        function saveStateToStorage() {
            try {
                localStorage.setItem('lumina_books', JSON.stringify(state.books));
                localStorage.setItem('lumina_settings', JSON.stringify(state.settings));
                if (state.currentBookId) {
                    localStorage.setItem('lumina_last_book_id', state.currentBookId);
                }
            } catch (e) {
                console.error('Storage quota or access error:', e);
            }
        }

        function loadStateFromStorage() {
            try {
                const savedBooks = localStorage.getItem('lumina_books');
                if (savedBooks) state.books = JSON.parse(savedBooks);

                const savedSettings = localStorage.getItem('lumina_settings');
                if (savedSettings) state.settings = { ...state.settings, ...JSON.parse(savedSettings) };

                const lastBookId = localStorage.getItem('lumina_last_book_id');
                if (lastBookId && state.books.some(b => b.id === lastBookId)) {
                    state.currentBookId = lastBookId;
                }
            } catch (e) {
                console.error('Failed to load state:', e);
            }
        }

        // --- NAVIGATION & VIEW MANAGEMENT ---
        function switchView(targetView) {
            state.currentView = targetView;

            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-library').classList.add('hidden');
            document.getElementById('view-reader').classList.add('hidden');

            document.getElementById(`view-${targetView}`).classList.remove('hidden');

            // Toggle Nav Buttons Visibility
            const btnBack = document.getElementById('btn-back');
            const btnReaderSettings = document.getElementById('btn-reader-settings');
            const btnTOC = document.getElementById('btn-toc');

            if (targetView === 'reader') {
                btnBack.classList.remove('hidden');
                btnReaderSettings.classList.remove('hidden');
                btnTOC.classList.remove('hidden');
                if (state.currentBookId) {
                    renderReaderContent();
                } else {
                    switchView('library');
                    return;
                }
            } else {
                btnBack.classList.add('hidden');
                btnReaderSettings.classList.add('hidden');
                btnTOC.classList.add('hidden');
            }

            // Update Active Nav Bar State
            document.querySelectorAll('.nav-item').forEach(el => {
                if (el.getAttribute('data-target') === targetView) {
                    el.classList.add('text-indigo-400');
                    el.classList.remove('text-gray-400');
                } else {
                    el.classList.remove('text-indigo-400');
                    el.classList.add('text-gray-400');
                }
            });
        }

        // --- TEXT PARSING & CLEANING ENGINE (NO HTML / NO SINGLE-LINE COLLAPSE) ---
        function parseAndCleanText(rawText) {
            // 1. Remove HTML tags if raw text is HTML
            let clean = rawText.replace(/<[^>]*>?/gm, '');

            // 2. Normalize line endings
            clean = clean.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

            // 3. Split into lines
            const lines = clean.split('\n');
            const blocks = [];
            const toc = [];

            // Regex patterns for chapters and dialogues
            const chapterRegex = /^(제\s*[\d\s一二三四五六七八九十백천]+[장화편목]|chapter\s*\d+|\d+화|\b\d+\b\.)/i;
            const dialogueRegex = /^["'「『"'](.+)["'」』"']$/;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return; // Skip blank lines safely

                // Classify Block Types
                if (chapterRegex.test(trimmed) || (trimmed.length < 35 && trimmed.startsWith('第'))) {
                    const blockId = `ch-${blocks.length}`;
                    blocks.push({ type: 'chapter', text: trimmed, id: blockId });
                    toc.push({ title: trimmed, blockId: blockId });
                } else if (dialogueRegex.test(trimmed) || trimmed.startsWith('"') || trimmed.startsWith('「')) {
                    blocks.push({ type: 'dialogue', text: trimmed });
                } else {
                    blocks.push({ type: 'paragraph', text: trimmed });
                }
            });

            // Auto Table of Contents fallback if no chapters detected
            if (toc.length === 0 && blocks.length > 0) {
                const step = Math.max(1, Math.floor(blocks.length / 10));
                for (let i = 0; i < blocks.length; i += step) {
                    const blockId = `ch-auto-${i}`;
                    blocks[i].id = blockId;
                    toc.push({
                        title: `지점 ${Math.round((i / blocks.length) * 100)}% (${blocks[i].text.slice(0, 15)}...)`,
                        blockId: blockId
                    });
                }
            }

            return { blocks, toc };
        }

        // --- FILE IMPORT ENGINE ---
        async function handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const fileExt = file.name.split('.').pop().toLowerCase();
            let rawText = '';

            try {
                if (fileExt === 'txt' || fileExt === 'md' || fileExt === 'html') {
                    rawText = await readTextFileWithEncoding(file);
                } else if (fileExt === 'pdf') {
                    rawText = await readPDFFile(file);
                } else if (fileExt === 'docx') {
                    rawText = await readDocxFile(file);
                } else if (fileExt === 'epub') {
                    rawText = await readEpubFile(file);
                } else {
                    rawText = await file.text();
                }

                const { blocks, toc } = parseAndCleanText(rawText);

                if (blocks.length === 0) {
                    alert('텍스트 내용을 추출할 수 없거나 빈 파일입니다.');
                    return;
                }

                const newBook = {
                    id: 'book_' + Date.now(),
                    title: file.name.replace(/\.[^/.]+$/, ""),
                    contentBlocks: blocks,
                    toc: toc,
                    scrollRatio: 0,
                    completed: false,
                    lastRead: Date.now()
                };

                state.books.unshift(newBook);
                state.currentBookId = newBook.id;
                saveStateToStorage();
                renderLibrary();
                switchView('reader');

            } catch (err) {
                console.error('File parsing error:', err);
                alert('파일을 읽는 도중 오류가 발생했습니다: ' + err.message);
            }
            event.target.value = ''; // Reset input
        }

        // Encoding Detection Helper for TXT
        function readTextFileWithEncoding(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const buffer = e.target.result;
                    let decoder = new TextDecoder('utf-8', { fatal: true });
                    try {
                        resolve(decoder.decode(buffer));
                    } catch (e) {
                        // Fallback to EUC-KR / CP949
                        decoder = new TextDecoder('euc-kr');
                        resolve(decoder.decode(buffer));
                    }
                };
                reader.readAsArrayBuffer(file);
            });
        }

        // PDF Parser
        async function readPDFFile(file) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let fullText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.str).join(' ');
                fullText += pageText + '\n\n';
            }
            return fullText;
        }

        // DOCX Parser (Extract XML)
        async function readDocxFile(file) {
            const zip = await JSZip.loadAsync(file);
            const docXml = await zip.file("word/document.xml").async("text");
            return docXml.replace(/<[^>]+>/g, '\n');
        }

        // EPUB Simple Text Extractor
        async function readEpubFile(file) {
            const zip = await JSZip.loadAsync(file);
            let fullText = '';
            const htmlFiles = Object.keys(zip.files).filter(f => f.endsWith('.html') || f.endsWith('.xhtml'));
            for (const path of htmlFiles) {
                const content = await zip.files[path].async('text');
                fullText += content.replace(/<[^>]+>/g, '\n') + '\n\n';
            }
            return fullText;
        }

        // --- RENDER CONTINUOUS SCROLL READER ---
        function renderReaderContent() {
            const book = state.books.find(b => b.id === state.currentBookId);
            if (!book) return;

            const container = document.getElementById('reader-scroll-content');
            container.innerHTML = ''; // Clear container completely

            // Render each block cleanly as distinct structural HTML elements
            const fragment = document.createDocumentFragment();

            book.contentBlocks.forEach((block) => {
                let el;
                if (block.type === 'chapter') {
                    el = document.createElement('h2');
                    el.className = 'reader-chapter-title';
                    if (block.id) el.id = block.id;
                } else if (block.type === 'dialogue') {
                    el = document.createElement('blockquote');
                    el.className = 'reader-dialogue';
                } else {
                    el = document.createElement('p');
                    el.className = 'reader-paragraph';
                }
                el.textContent = block.text; // Text node rendering prevents HTML code injection
                fragment.appendChild(el);
            });

            container.appendChild(fragment);
            renderTOCList(book.toc);

            // Restore Exact Scroll Position safely after rendering
            requestAnimationFrame(() => {
                const scrollView = document.getElementById('reader-scroll-view');
                const targetScrollTop = book.scrollRatio * (scrollView.scrollHeight - scrollView.clientHeight);
                scrollView.scrollTop = targetScrollTop || 0;
            });
        }

        // --- REAL-TIME SCROLL POSITION & AUTOSAVE ---
        function handleReaderScroll(el) {
            if (!state.currentBookId) return;

            const maxScroll = el.scrollHeight - el.clientHeight;
            if (maxScroll <= 0) return;

            const ratio = el.scrollTop / maxScroll;
            const book = state.books.find(b => b.id === state.currentBookId);
            if (book) {
                book.scrollRatio = Math.min(1, Math.max(0, ratio));
                book.lastRead = Date.now();
                if (ratio >= 0.98) book.completed = true;
                saveStateToStorage();
            }

            // Directional Scroll Auto-Hide Navbar
            const currentScrollTop = el.scrollTop;
            const topNav = document.getElementById('top-nav');
            const bottomNav = document.getElementById('bottom-nav');

            if (currentScrollTop > state.lastScrollTop && currentScrollTop > 60) {
                topNav.classList.add('nav-hidden');
                bottomNav.classList.add('nav-bottom-hidden');
            } else {
                topNav.classList.remove('nav-hidden');
                bottomNav.classList.remove('nav-bottom-hidden');
            }
            state.lastScrollTop = currentScrollTop;
        }

        // --- TYPOGRAPHY & FONT BINDING ENGINE ---
        function setFontFamily(family) {
            state.settings.fontFamily = family;
            applySettingsToCSS();
            saveStateToStorage();
        }

        function updateTypographySettings() {
            state.settings.fontSize = document.getElementById('input-font-size').value;
            state.settings.lineHeight = document.getElementById('input-line-height').value;
            state.settings.letterSpacing = document.getElementById('input-letter-spacing').value;

            document.getElementById('label-font-size').textContent = `${state.settings.fontSize}px`;
            document.getElementById('label-line-height').textContent = state.settings.lineHeight;
            document.getElementById('label-letter-spacing').textContent = `${state.settings.letterSpacing}em`;

            applySettingsToCSS();
            saveStateToStorage();
        }

        function applySettingsToCSS() {
            const root = document.documentElement;
            root.style.setProperty('--reader-font-family', `'${state.settings.fontFamily}', serif`);
            root.style.setProperty('--reader-font-size', `${state.settings.fontSize}px`);
            root.style.setProperty('--reader-line-height', state.settings.lineHeight);
            root.style.setProperty('--reader-letter-spacing', `${state.settings.letterSpacing}em`);

            // Apply Theme
            const readerView = document.getElementById('view-reader');
            readerView.className = `flex-1 relative flex flex-col h-full bg-reader-${state.settings.theme}`;
        }

        function setTheme(theme) {
            state.settings.theme = theme;
            applySettingsToCSS();
            saveStateToStorage();
        }

        // --- LIBRARY ENGINE ---
        function setLibraryTab(tab) {
            state.libraryTab = tab;
            document.getElementById('tab-reading').className = tab === 'reading'
                ? 'pb-2 text-sm font-bold border-b-2 border-indigo-500 text-indigo-400'
                : 'pb-2 text-sm font-medium border-b-2 border-transparent text-gray-400 hover:text-gray-200';

            document.getElementById('tab-completed').className = tab === 'completed'
                ? 'pb-2 text-sm font-bold border-b-2 border-indigo-500 text-indigo-400'
                : 'pb-2 text-sm font-medium border-b-2 border-transparent text-gray-400 hover:text-gray-200';

            renderLibrary();
        }

        function renderLibrary() {
            const listContainer = document.getElementById('book-list');
            listContainer.innerHTML = '';

            const filteredBooks = state.books.filter(b => state.libraryTab === 'completed' ? b.completed : !b.completed);

            document.getElementById('count-reading').textContent = state.books.filter(b => !b.completed).length;
            document.getElementById('count-completed').textContent = state.books.filter(b => b.completed).length;

            if (filteredBooks.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-16 text-gray-500 space-y-2">
                        <i data-lucide="book-x" class="w-10 h-10 mx-auto opacity-40"></i>
                        <p class="text-xs">보관된 도서가 없습니다.</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            filteredBooks.forEach(book => {
                const percent = Math.round((book.scrollRatio || 0) * 100);
                const card = document.createElement('div');
                card.className = "bg-gray-800/80 border border-gray-700/60 rounded-xl p-4 flex items-center justify-between shadow-md hover:border-indigo-500/50 transition-all cursor-pointer group";
                card.onclick = () => {
                    state.currentBookId = book.id;
                    saveStateToStorage();
                    switchView('reader');
                };

                card.innerHTML = `
                    <div class="flex-1 min-w-0 pr-3">
                        <h4 class="font-bold text-sm text-gray-100 line-clamp-2 leading-snug group-hover:text-indigo-300 transition-colors">
                            ${escapeHtml(book.title)}
                        </h4>
                        <div class="flex items-center space-x-3 mt-2 text-xs text-gray-400">
                            <span>진도율 ${percent}%</span>
                            <span>•</span>
                            <span>${new Date(book.lastRead).toLocaleDateString()}</span>
                        </div>
                        <div class="w-full bg-gray-700 h-1.5 rounded-full mt-2 overflow-hidden">
                            <div class="bg-indigo-500 h-full rounded-full" style="width: ${percent}%"></div>
                        </div>
                    </div>
                    <button onclick="deleteBook(event, '${book.id}')" class="p-2 text-gray-500 hover:text-red-400 hover:bg-gray-700 rounded-lg transition-colors">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                `;
                listContainer.appendChild(card);
            });
            lucide.createIcons();
        }

        function deleteBook(event, id) {
            event.stopPropagation();
            if (confirm('이 도서를 서재에서 삭제하시겠습니까?')) {
                state.books = state.books.filter(b => b.id !== id);
                if (state.currentBookId === id) state.currentBookId = null;
                saveStateToStorage();
                renderLibrary();
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // --- TOC DRAWER ENGINE ---
        function toggleTOC() {
            const drawer = document.getElementById('toc-drawer');
            drawer.classList.toggle('hidden');
        }

        function renderTOCList(tocItems) {
            const container = document.getElementById('toc-list');
            container.innerHTML = '';

            if (!tocItems || tocItems.length === 0) {
                container.innerHTML = '<div class="text-gray-500 text-xs py-4 text-center">목차가 없습니다.</div>';
                return;
            }

            tocItems.forEach(item => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left py-2 px-3 rounded-lg hover:bg-gray-800 text-gray-300 hover:text-indigo-400 transition-colors text-xs truncate";
                btn.textContent = item.title;
                btn.onclick = () => {
                    toggleTOC();
                    const targetEl = document.getElementById(item.blockId);
                    if (targetEl) {
                        targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                };
                container.appendChild(btn);
            });
        }

        // --- READER SETTINGS MODAL ---
        function toggleReaderSettingsModal() {
            const modal = document.getElementById('settings-modal');
            modal.classList.toggle('hidden');
        }

        // --- SYSTEM TTS ENGINE ---
        function toggleTTSBar() {
            const bar = document.getElementById('tts-bar');
            bar.classList.toggle('hidden');
        }

        function toggleTTS() {
            if (state.tts.speaking) {
                state.tts.synth.pause();
                state.tts.speaking = false;
                document.getElementById('btn-tts-play').innerHTML = `<i data-lucide="play" class="w-5 h-5 text-white"></i>`;
            } else {
                if (state.tts.synth.paused) {
                    state.tts.synth.resume();
                } else {
                    speakBlock(0);
                }
                state.tts.speaking = true;
                document.getElementById('btn-tts-play').innerHTML = `<i data-lucide="pause" class="w-5 h-5 text-white"></i>`;
            }
            lucide.createIcons();
        }

        function speakBlock(index) {
            const book = state.books.find(b => b.id === state.currentBookId);
            if (!book || index >= book.contentBlocks.length) {
                stopTTS();
                return;
            }

            state.tts.blockIndex = index;
            const text = book.contentBlocks[index].text;
            document.getElementById('tts-snippet').textContent = text;
            document.getElementById('tts-status').textContent = `재생 중 (${index + 1}/${book.contentBlocks.length})`;

            state.tts.utterance = new SpeechSynthesisUtterance(text);
            state.tts.utterance.lang = 'ko-KR';
            state.tts.utterance.rate = state.tts.rate;

            state.tts.utterance.onend = () => {
                if (state.tts.speaking) speakBlock(index + 1);
            };

            state.tts.synth.speak(state.tts.utterance);
        }

        function stopTTS() {
            state.tts.synth.cancel();
            state.tts.speaking = false;
            document.getElementById('tts-bar').classList.add('hidden');
            document.getElementById('btn-tts-play').innerHTML = `<i data-lucide="play" class="w-5 h-5 text-white"></i>`;
            lucide.createIcons();
        }

        function updateTTSSettings() {
            state.tts.rate = parseFloat(document.getElementById('tts-rate').value);
            if (state.tts.speaking) {
                state.tts.synth.cancel();
                speakBlock(state.tts.blockIndex);
            }
        }

        // --- PRIVACY MODE ---
        function togglePrivacyMode() {
            state.privacyMode = !state.privacyMode;
            const overlay = document.getElementById('privacy-overlay');
            if (state.privacyMode) {
                overlay.classList.remove('hidden');
            } else {
                overlay.classList.add('hidden');
            }
        }

        function setupScrollBehavior() {
            // Placeholder for touch gestures or swipe logic if needed
        }
    </script>
</body>
