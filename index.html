<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lumina Reader - 프리미엄 독서웹앱</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Nanum Myeongjo"', '"Gowun Batang"', '"Noto Serif KR"', 'serif'],
                        sans: ['"Apple SD Gothic Neo"', 'Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: 나눔명조, 고운바탕, 노토세리프 -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Nanum+Myeongjo:wght@400;700&family=Noto+Serif+KR:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- PDF.js, Mammoth, ePub.js, Marked CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.93/epub.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { font-family: 'Nanum Myeongjo', serif; }
        .theme-light { background-color: #faf7f2; color: #2b2b2b; }
        .theme-sepia { background-color: #f4ecd8; color: #5c4033; }
        .theme-dark { background-color: #1a1a1a; color: #e0e0e0; }
        .theme-oled { background-color: #000000; color: #f1f5f9; }
        /* 스크롤바 숨기기 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-full theme-light overflow-hidden flex flex-col selection:bg-amber-200">

    <!-- PWA Service Worker 동적 등록 -->
    <script>
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', e => self.skipWaiting());
                self.addEventListener('activate', e => e.clients.claim());
                self.addEventListener('fetch', e => {
                    e.respondWith(
                        caches.match(e.request).then(cached => cached || fetch(e.request).catch(() => caches.match('./index.html')))
                    );
                });
            `;
            const blob = new Blob([swCode], { type: 'text/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
        }
    </script>

    <!-- 숨겨진 파일 인풋 -->
    <input type="file" id="fileInput" class="hidden" accept=".txt,.docx,.pdf,.epub,.md,.html">

    <!-- 1. 홈 화면 (Home View) -->
    <div id="view-home" class="flex-1 flex flex-col overflow-y-auto pb-20 pt-safe px-6">
        <div class="max-w-md mx-auto w-full my-auto py-12 text-center">
            <div class="w-20 h-20 mx-auto mb-6 bg-gradient-to-tr from-amber-600 to-amber-400 rounded-3xl shadow-xl flex items-center justify-center text-white text-3xl font-bold tracking-wider">
                L
            </div>
            <h1 class="text-3xl font-bold tracking-tight mb-3">LUMINA</h1>
            <p class="text-sm opacity-70 mb-10 leading-relaxed">
                모든 서적 파일을 완벽한 가독성과 미니멀한 인터페이스로 경험하세요. 프라이버시가 완벽히 보호되는 로컬 독서 공간입니다.
            </p>
            <div class="space-y-3">
                <button onclick="switchView('library')" class="w-full py-4 bg-amber-700 hover:bg-amber-800 text-white font-medium rounded-2xl shadow-lg transition flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                    내 서재로 이동
                </button>
                <button onclick="triggerFileOpen()" class="w-full py-4 border border-amber-800/30 hover:bg-amber-900/5 font-medium rounded-2xl transition flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    새 파일 바로 열기
                </button>
                <button onclick="openPasteModal()" class="w-full py-3 text-sm opacity-70 hover:opacity-100 transition">
                    + TXT 텍스트 직접 붙여넣기
                </button>
            </div>
            <div class="mt-12 text-xs opacity-40">
                Lumina Reader v3.5 • Private Local Storage
            </div>
        </div>
    </div>

    <!-- 2. 서재 화면 (Library View) -->
    <div id="view-library" class="flex-1 flex flex-col overflow-hidden hidden">
        <div class="px-6 py-4 border-b border-black/5 flex items-center justify-between shrink-0">
            <h2 class="text-xl font-bold">내 서재</h2>
            <div class="flex items-center gap-2">
                <button onclick="triggerFileOpen()" class="px-4 py-2 bg-amber-700 text-white text-sm font-medium rounded-xl shadow">파일 추가</button>
            </div>
        </div>
        <!-- 탭 메뉴 -->
        <div class="flex border-b border-black/5 px-6 shrink-0">
            <button onclick="switchLibTab('reading')" id="tab-reading" class="py-3 px-4 text-sm font-bold border-b-2 border-amber-700">읽는 중</button>
            <button onclick="switchLibTab('completed')" id="tab-completed" class="py-3 px-4 text-sm font-medium opacity-60 border-b-2 border-transparent">다 읽은 책</button>
        </div>
        <!-- 목록 컨테이너 -->
        <div id="library-list" class="flex-1 overflow-y-auto p-6 space-y-4">
            <!-- 동적 렌더링 -->
        </div>
    </div>

    <!-- 3. 독서 화면 (Reader View) -->
    <div id="view-reader" class="flex-1 flex flex-col overflow-hidden hidden relative">
        <!-- 상단 플로팅 바 (슬림 컴팩트) -->
        <header id="reader-header" class="absolute top-0 left-0 right-0 z-30 transition-transform duration-300 backdrop-blur-md bg-opacity-90 border-b border-black/5 flex items-center justify-between px-4 h-12">
            <div class="flex items-center gap-2 overflow-hidden">
                <button onclick="switchView('library')" class="p-1.5 rounded-lg opacity-70 hover:opacity-100">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                </button>
                <span id="header-book-title" class="text-sm font-bold truncate max-w-[160px] sm:max-w-xs">책 제목</span>
            </div>
            <div class="flex items-center gap-1">
                <button onclick="toggleTocModal(true)" class="p-2 rounded-lg opacity-70 hover:opacity-100" title="목차">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"/></svg>
                </button>
                <button onclick="toggleSettingsModal(true)" class="p-2 rounded-lg opacity-70 hover:opacity-100" title="글꼴/서식">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
                </button>
                <button onclick="toggleTtsPlayer()" id="tts-btn" class="p-2 rounded-lg opacity-70 hover:opacity-100" title="음성 듣기">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.703L5.586 15z"/></svg>
                </button>
            </div>
        </header>

        <!-- 본문 스크롤 영역 (전체화면 밀착) -->
        <div id="reader-scroll-container" class="flex-1 overflow-y-auto px-6 pt-16 pb-24 outline-none" tabindex="0">
            <div id="reader-content" class="max-w-2xl mx-auto space-y-6 text-justify leading-relaxed">
                <!-- 독서 텍스트 출력 영역 -->
            </div>
        </div>

        <!-- 하단 진도율 프로그레스 바 및 네비게이션 -->
        <div id="reader-footer" class="absolute bottom-0 left-0 right-0 z-30 transition-transform duration-300 backdrop-blur-md bg-opacity-90 border-t border-black/5 px-6 py-2 flex items-center justify-between text-xs opacity-70">
            <span id="reading-progress-text">진도율 0%</span>
            <span id="reading-current-chapter">시작 부분</span>
        </div>
    </div>

    <!-- 하단 고정 네비게이션 바 (홈, 서재, 리더 전환) -->
    <nav class="h-14 border-t border-black/10 flex items-center justify-around shrink-0 z-40 bg-inherit pb-safe">
        <button onclick="switchView('home')" class="flex flex-col items-center justify-center flex-1 h-full opacity-70 hover:opacity-100" id="nav-btn-home">
            <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            <span class="text-[10px]">홈</span>
        </button>
        <button onclick="switchView('library')" class="flex flex-col items-center justify-center flex-1 h-full opacity-70 hover:opacity-100" id="nav-btn-library">
            <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
            <span class="text-[10px]">서재</span>
        </button>
        <button onclick="switchView('reader')" class="flex flex-col items-center justify-center flex-1 h-full opacity-70 hover:opacity-100" id="nav-btn-reader">
            <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
            <span class="text-[10px]">리더</span>
        </button>
    </nav>

    <!-- 목차 모달 -->
    <div id="toc-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="w-full sm:max-w-md max-h-[80vh] bg-inherit border border-black/10 rounded-t-3xl sm:rounded-3xl flex flex-col overflow-hidden shadow-2xl">
            <div class="px-6 py-4 border-b border-black/10 flex items-center justify-between">
                <h3 class="font-bold text-lg">목차</h3>
                <button onclick="toggleTocModal(false)" class="p-1 opacity-70 hover:opacity-100">✕</button>
            </div>
            <div id="toc-list" class="flex-1 overflow-y-auto p-4 space-y-2">
                <!-- 목차 목록 -->
            </div>
        </div>
    </div>

    <!-- 설정 모달 (글꼴, 크기, 테마) -->
    <div id="settings-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="w-full sm:max-w-md bg-inherit border border-black/10 rounded-t-3xl sm:rounded-3xl flex flex-col overflow-hidden shadow-2xl p-6 space-y-6">
            <div class="flex items-center justify-between border-b border-black/10 pb-4">
                <h3 class="font-bold text-lg">독서 설정</h3>
                <button onclick="toggleSettingsModal(false)" class="p-1 opacity-70 hover:opacity-100">✕</button>
            </div>
            <!-- 테마 선택 -->
            <div>
                <label class="text-xs font-bold opacity-60 uppercase tracking-wider mb-2 block">화면 테마</label>
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="setTheme('light')" class="py-2.5 rounded-xl border border-amber-800/20 bg-[#faf7f2] text-[#2b2b2b] text-xs font-medium">따뜻한빛</button>
                    <button onclick="setTheme('sepia')" class="py-2.5 rounded-xl border border-amber-800/20 bg-[#f4ecd8] text-[#5c4033] text-xs font-medium">세피아</button>
                    <button onclick="setTheme('dark')" class="py-2.5 rounded-xl border border-black/20 bg-[#1a1a1a] text-[#e0e0e0] text-xs font-medium">다크</button>
                    <button onclick="setTheme('oled')" class="py-2.5 rounded-xl border border-white/20 bg-[#000000] text-[#f1f5f9] text-xs font-medium">OLED</button>
                </div>
            </div>
            <!-- 글꼴 선택 -->
            <div>
                <label class="text-xs font-bold opacity-60 uppercase tracking-wider mb-2 block">글꼴 선택</label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="setFontFamily('Nanum Myeongjo')" class="py-2 rounded-xl border border-black/10 text-xs font-serif">나눔명조</button>
                    <button onclick="setFontFamily('Gowun Batang')" class="py-2 rounded-xl border border-black/10 text-xs font-serif">고운바탕</button>
                    <button onclick="setFontFamily('Apple SD Gothic Neo')" class="py-2 rounded-xl border border-black/10 text-xs font-sans">산스(고딕)</button>
                </div>
            </div>
            <!-- 글자 크기 조절 -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-bold opacity-60 uppercase tracking-wider">글자 크기</label>
                    <span id="font-size-val" class="text-xs font-bold">18px</span>
                </div>
                <input type="range" min="14" max="28" value="18" oninput="setFontSize(this.value)" class="w-full accent-amber-700">
            </div>
        </div>
    </div>

    <!-- 직접 텍스트 붙여넣기 모달 -->
    <div id="paste-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="w-full sm:max-w-lg bg-inherit border border-black/10 rounded-3xl flex flex-col overflow-hidden shadow-2xl p-6 space-y-4">
            <div class="flex items-center justify-between border-b border-black/10 pb-3">
                <h3 class="font-bold text-lg">TXT 텍스트 붙여넣기</h3>
                <button onclick="closePasteModal()" class="p-1 opacity-70 hover:opacity-100">✕</button>
            </div>
            <input type="text" id="paste-title-input" placeholder="책 제목을 입력하세요" class="w-full px-4 py-3 rounded-xl border border-black/10 bg-transparent text-sm outline-none">
            <textarea id="paste-content-input" placeholder="여기에 텍스트를 붙여넣으세요..." class="w-full h-48 px-4 py-3 rounded-xl border border-black/10 bg-transparent text-sm outline-none resize-none"></textarea>
            <button onclick="savePastedText()" class="w-full py-3 bg-amber-700 text-white font-medium rounded-xl">서재에 추가하고 읽기</button>
        </div>
    </div>

    <!-- 핵심 자바스크립트 로직 -->
    <script>
        let currentView = 'home';
        let library = JSON.parse(localStorage.getItem('lumina_library') || '[]');
        let currentBookId = null;
        let activeBook = null;
        let currentTheme = localStorage.getItem('lumina_theme') || 'light';
        let currentFont = localStorage.getItem('lumina_font') || 'Nanum Myeongjo';
        let currentSize = localStorage.getItem('lumina_size') || '18';

        // 초기화 실행
        window.addEventListener('DOMContentLoaded', () => {
            setTheme(currentTheme);
            setFontFamily(currentFont);
            setFontSize(currentSize);
            renderLibrary();
            
            // 파일 업로드 이벤트 연결
            document.getElementById('fileInput').addEventListener('change', handleFileSelect);

            // 스크롤 이벤트 (진도율 및 자동 저장)
            const scrollContainer = document.getElementById('reader-scroll-container');
            scrollContainer.addEventListener('scroll', () => {
                if (!currentBookId) return;
                const scrollTop = scrollContainer.scrollTop;
                const scrollHeight = scrollContainer.scrollHeight - scrollContainer.clientHeight;
                if (scrollHeight <= 0) return;
                const progress = Math.min(100, Math.max(0, Math.round((scrollTop / scrollHeight) * 100)));
                
                document.getElementById('reading-progress-text').innerText = `진도율 ${progress}%`;
                
                // 로컬 스토리지에 진행도 저장
                const book = library.find(b => b.id === currentBookId);
                if (book) {
                    book.progress = progress;
                    book.scrollTop = scrollTop;
                    if (progress >= 95) book.completed = true;
                    localStorage.setItem('lumina_library', JSON.stringify(library));
                }
            });
        });

        // 화면 전환 함수
        function switchView(viewName) {
            currentView = viewName;
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-library').classList.add('hidden');
            document.getElementById('view-reader').classList.add('hidden');

            document.getElementById(`view-${viewName}`).classList.remove('hidden');

            // 하단 네비게이션 활성화 표시
            ['home', 'library', 'reader'].forEach(v => {
                const btn = document.getElementById(`nav-btn-${v}`);
                if (btn) btn.style.opacity = (v === viewName) ? '1' : '0.6';
            });

            if (viewName === 'library') renderLibrary();
        }

        // 탭 전환 (읽는 중 / 다 읽은 책)
        let activeLibTab = 'reading';
        function switchLibTab(tab) {
            activeLibTab = tab;
            document.getElementById('tab-reading').className = tab === 'reading' ? 'py-3 px-4 text-sm font-bold border-b-2 border-amber-700' : 'py-3 px-4 text-sm font-medium opacity-60 border-b-2 border-transparent';
            document.getElementById('tab-completed').className = tab === 'completed' ? 'py-3 px-4 text-sm font-bold border-b-2 border-amber-700' : 'py-3 px-4 text-sm font-medium opacity-60 border-b-2 border-transparent';
            renderLibrary();
        }

        // 서재 목록 렌더링
        function renderLibrary() {
            const listEl = document.getElementById('library-list');
            listEl.innerHTML = '';
            
            const filtered = library.filter(b => activeLibTab === 'completed' ? b.completed : !b.completed);

            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="text-center py-12 opacity-50 text-sm">저장된 도서가 없습니다. 파일을 추가해보세요.</div>`;
                return;
            }

            filtered.forEach(book => {
                const item = document.createElement('div');
                item.className = 'p-4 rounded-2xl border border-black/10 flex items-center justify-between gap-4 bg-inherit hover:border-amber-700/50 transition cursor-pointer';
                item.onclick = () => openBook(book.id);
                item.innerHTML = `
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-sm truncate line-clamp-2">${escapeHtml(book.title)}</h4>
                        <div class="flex items-center gap-3 mt-2 text-xs opacity-60">
                            <span>진도율 ${book.progress || 0}%</span>
                            <span>•</span>
                            <span>${new Date(book.date).toLocaleDateString()}</span>
                        </div>
                    </div>
                    <button onclick="event.stopPropagation(); deleteBook('${book.id}')" class="p-2 opacity-50 hover:opacity-100 text-red-500" title="삭제">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    </button>
                `;
                listEl.appendChild(item);
            });
        }

        // 파일 선택 트리거
        function triggerFileOpen() {
            document.getElementById('fileInput').click();
        }

        // 파일 파싱 메인 핸들러
        async function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            const ext = file.name.split('.').pop().toLowerCase();
            const title = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;

            let content = '';
            let chapters = [];

            try {
                if (ext === 'txt') {
                    content = await readTextFile(file);
                    chapters = parseChapters(content);
                } else if (ext === 'docx') {
                    const arrayBuffer = await file.arrayBuffer();
                    const result = await mammoth.convertToHtml({ arrayBuffer });
                    content = htmlToCleanParagraphs(result.value);
                    chapters = parseChapters(content);
                } else if (ext === 'pdf') {
                    content = await parsePdfFile(file);
                    chapters = parseChapters(content);
                } else if (ext === 'epub') {
                    content = await parseEpubFile(file);
                    chapters = parseChapters(content);
                } else if (ext === 'md' || ext === 'html') {
                    const raw = await readTextFile(file);
                    content = ext === 'md' ? marked.parse(raw) : htmlToCleanParagraphs(raw);
                    chapters = parseChapters(content);
                }

                const bookObj = {
                    id: 'book_' + Date.now(),
                    title: title,
                    content: content,
                    chapters: chapters,
                    progress: 0,
                    scrollTop: 0,
                    completed: false,
                    date: Date.now()
                };

                library.unshift(bookObj);
                localStorage.setItem('lumina_library', JSON.stringify(library));
                openBook(bookObj.id);
            } catch (err) {
                alert('파일을 읽는 중 오류가 발생했습니다: ' + err.message);
            } finally {
                e.target.value = '';
            }
        }

        // 텍스트 파일 인코딩 자동 감지 및 읽기 (UTF-8, CP949, ANSI)
        async function readTextFile(file) {
            const buffer = await file.arrayBuffer();
            try {
                const decoder = new TextDecoder('utf-8', { fatal: true });
                return decoder.decode(buffer);
            } catch {
                try {
                    const decoder = new TextDecoder('euc-kr');
                    return decoder.decode(buffer);
                } catch {
                    const decoder = new TextDecoder('ansi');
                    return decoder.decode(buffer);
                }
            }
        }

        // PDF 파일 지능형 좌표 파싱 (한 줄 뭉개짐 방지)
        async function parsePdfFile(file) {
            const typedarray = new Uint8Array(await file.arrayBuffer());
            const pdf = await pdfjsLib.getDocument(typedarray).promise;
            let fullText = '';

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                let lastY = null;
                let pageText = '';

                textContent.items.forEach(item => {
                    const y = Math.round(item.transform[5]);
                    if (lastY !== null && Math.abs(lastY - y) > 8) {
                        pageText += '\n';
                    }
                    pageText += item.str + ' ';
                    lastY = y;
                });
                fullText += pageText + '\n\n';
            }
            return htmlToCleanParagraphs(fullText);
        }

        // EPUB 파서
        async function parseEpubFile(file) {
            const book = ePub(await file.arrayBuffer());
            await book.ready;
            let fullText = '';
            for (const spineItem of book.spine) {
                const item = book.navigation.get(spineItem.href) || spineItem;
                try {
                    const doc = await book.load(spineItem.href);
                    if (doc && doc.body) {
                        fullText += doc.body.innerHTML + '\n\n';
                    }
                } catch (e) {}
            }
            return htmlToCleanParagraphs(fullText);
        }

        // HTML 태그 정제 및 블록별 줄바꿈 생성
        function htmlToCleanParagraphs(htmlStr) {
            const div = document.createElement('div');
            div.innerHTML = htmlStr;
            const blocks = div.querySelectorAll('p, h1, h2, h3, h4, h5, h6, div, br, li');
            if (blocks.length === 0) return div.textContent;

            let result = '';
            blocks.forEach(el => {
                const text = el.textContent.trim();
                if (text) {
                    result += text + '\n\n';
                }
            });
            return result || div.textContent;
        }

        // 목차 파서 및 챕터 감지 (한글 소설/문서 로직 완벽 반영)
        function parseChapters(text) {
            const lines = text.split('\n');
            const chapters = [];
            const regex = /^(제\s*\d+\s*[장부화편]|[0-9]+\.\s+|Chapter\s+\d+|[0-9]+화)/i;

            lines.forEach((line, idx) => {
                const trimmed = line.trim();
                if (trimmed.length > 0 && trimmed.length < 50 && regex.test(trimmed)) {
                    chapters.push({ title: trimmed, lineIndex: idx });
                }
            });

            // 목차가 없을 경우 임의 목차 생성 (500라인 단위)
            if (chapters.length === 0) {
                for (let i = 0; i < lines.length; i += 500) {
                    chapters.push({ title: `파트 ${Math.floor(i/500) + 1}`, lineIndex: i });
                }
            }
            return chapters;
        }

        // 책 열기
        function openBook(id) {
            const book = library.find(b => b.id === id);
            if (!book) return;
            currentBookId = id;
            activeBook = book;

            document.getElementById('header-book-title').innerText = book.title;
            renderReaderContent(book);
            switchView('reader');

            // 이전 스크롤 위치 복원
            setTimeout(() => {
                const sc = document.getElementById('reader-scroll-container');
                if (sc && book.scrollTop) {
                    sc.scrollTop = book.scrollTop;
                }
            }, 50);
        }

        // 본문 렌더링 (대사 인용구 서식, 현대적 밀레니엄 스타일)
        function renderReaderContent(book) {
            const contentEl = document.getElementById('reader-content');
            contentEl.innerHTML = '';

            const lines = book.content.split('\n');
            let htmlOutput = '';

            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed) return;

                // 제목 감지
                if (/^(제\s*\d+\s*[장부화편]|[0-9]+\.\s+|Chapter\s+\d+|[0-9]+화)/i.test(trimmed)) {
                    htmlOutput += `<h2 class="text-xl font-bold mt-8 mb-4 border-b border-black/10 pb-2">${escapeHtml(trimmed)}</h2>`;
                } 
                // 대사 감지 ("...", 「...」, “...”)
                else if (/^["“「｢].*["”」｣]$/.test(trimmed) || trimmed.startsWith('"') || trimmed.startsWith('“') || trimmed.startsWith('「')) {
                    htmlOutput += `<blockquote class="pl-4 border-l-2 border-amber-600/50 my-3 opacity-90 italic">${escapeHtml(trimmed)}</blockquote>`;
                } 
                // 일반 본문
                else {
                    htmlOutput += `<p class="mb-4 leading-relaxed">${escapeHtml(trimmed)}</p>`;
                }
            });

            contentEl.innerHTML = htmlOutput;
        }

        // 도서 삭제
        function deleteBook(id) {
            library = library.filter(b => b.id !== id);
            localStorage.setItem('lumina_library', JSON.stringify(library));
            renderLibrary();
        }

        // 직접 붙여넣기 저장
        function savePastedText() {
            const title = document.getElementById('paste-title-input').value.trim() || '제목 없는 텍스트';
            const content = document.getElementById('paste-content-input').value.trim();
            if (!content) {
                alert('내용을 입력해주세요.');
                return;
            }

            const bookObj = {
                id: 'book_' + Date.now(),
                title: title,
                content: htmlToCleanParagraphs(content),
                chapters: parseChapters(content),
                progress: 0,
                scrollTop: 0,
                completed: false,
                date: Date.now()
            };

            library.unshift(bookObj);
            localStorage.setItem('lumina_library', JSON.stringify(library));
            closePasteModal();
            openBook(bookObj.id);
        }

        // 모달 제어 함수들
        function openPasteModal() { document.getElementById('paste-modal').classList.remove('hidden'); }
        function closePasteModal() { document.getElementById('paste-modal').classList.add('hidden'); }
        function toggleTocModal(show) {
            const modal = document.getElementById('toc-modal');
            if (show) {
                renderTocList();
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }
        function toggleSettingsModal(show) {
            document.getElementById('settings-modal').classList.toggle('hidden', !show);
        }

        // 목차 리스트 렌더링
        function renderTocList() {
            const tocEl = document.getElementById('toc-list');
            tocEl.innerHTML = '';
            if (!activeBook || !activeBook.chapters || activeBook.chapters.length === 0) {
                tocEl.innerHTML = `<div class="p-4 text-center opacity-50 text-sm">목차가 없습니다.</div>`;
                return;
            }

            activeBook.chapters.forEach(ch => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-3 rounded-xl hover:bg-black/5 text-sm font-medium transition truncate';
                btn.innerText = ch.title;
                btn.onclick = () => {
                    toggleTocModal(false);
                    // 해당 위치로 스크롤 이동 로직
                    const sc = document.getElementById('reader-scroll-container');
                    sc.scrollTop = ch.lineIndex * 30; // 대략적인 위치 스크롤
                };
                tocEl.appendChild(btn);
            });
        }

        // 설정 변경 함수들 (즉시 반영)
        function setTheme(theme) {
            currentTheme = theme;
            localStorage.setItem('lumina_theme', theme);
            document.body.className = `h-full theme-${theme} overflow-hidden flex flex-col selection:bg-amber-200`;
        }

        function setFontFamily(font) {
            currentFont = font;
            localStorage.setItem('lumina_font', font);
            document.body.style.fontFamily = font;
        }

        function setFontSize(size) {
            currentSize = size;
            localStorage.setItem('lumina_size', size);
            document.getElementById('font-size-val').innerText = size + 'px';
            document.getElementById('reader-content').style.fontSize = size + 'px';
        }

        // 시스템 TTS 기능
        let isSpeaking = false;
        function toggleTtsPlayer() {
            if (!('speechSynthesis' in window)) {
                alert('이 브라우저는 음성 읽기(TTS)를 지원하지 않습니다.');
                return;
            }
            if (isSpeaking) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
                document.getElementById('tts-btn').classList.remove('text-amber-600');
            } else {
                const text = document.getElementById('reader-content').innerText;
                if (!text) return;
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = 1.0;
                utterance.onend = () => { isSpeaking = false; document.getElementById('tts-btn').classList.remove('text-amber-600'); };
                window.speechSynthesis.speak(utterance);
                isSpeaking = true;
                document.getElementById('tts-btn').classList.add('text-amber-600');
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
