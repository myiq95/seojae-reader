<!DOCTYPE html>
<html lang="ko" class="h-full dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lumina Reader</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f3ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            },
            sepia: {
              base: '#fbf0d9',
              text: '#433422',
              card: '#f4e4c1',
              border: '#e4d2a3'
            }
          },
          fontFamily: {
            myeongjo: ['"Nanum Myeongjo"', 'serif'],
            batang: ['"Gowun Batang"', 'serif'],
            serifkr: ['"Noto Serif KR"', 'serif'],
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Web Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <!-- Icons (Lucide) -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- External Parsers -->
  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
  <!-- JSZip & ePub.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
  <!-- Mammoth.js for DOCX -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

  <style>
    /* Safe Area & iOS Dynamic Height Adjustments */
    html, body {
      height: 100%;
      height: 100dvh;
      background-color: #030712;
      color: #f3f4f6;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .pb-safe {
      padding-bottom: max(env(safe-area-inset-bottom, 16px), 12px);
    }
    
    .pt-safe {
      padding-top: max(env(safe-area-inset-top, 16px), 12px);
    }

    /* iOS Native Smooth Scroll Enforcer */
    .scrollable-y {
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch !important;
      touch-action: pan-y !important;
      overscroll-behavior-y: contain;
    }

    /* Reading Typography Custom Themes */
    .reader-theme-dark {
      background-color: #0f172a !important;
      color: #cbd5e1 !important;
    }
    .reader-theme-light {
      background-color: #ffffff !important;
      color: #1e293b !important;
    }
    .reader-theme-sepia {
      background-color: #fbf0d9 !important;
      color: #433422 !important;
    }
    .reader-theme-black {
      background-color: #000000 !important;
      color: #a3a3a3 !important;
    }

    /* Custom Scrollbar for Smooth Reading */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.3);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(156, 163, 175, 0.5);
    }

    /* Formatted Reader Text Styling */
    .reader-paragraph {
      margin-bottom: 1.25em;
      line-height: inherit;
      text-align: justify;
      word-break: keep-all;
      overflow-wrap: break-word;
    }
    
    .reader-heading {
      font-weight: 700;
      margin-top: 2em;
      margin-bottom: 1em;
      line-height: 1.3;
      word-break: keep-all;
      color: currentColor;
      border-bottom: 1px solid rgba(150, 150, 150, 0.2);
      padding-bottom: 0.4em;
    }

    .reader-dialogue {
      padding-left: 0.75rem;
      border-left: 3px solid #6366f1;
      margin-top: 0.75em;
      margin-bottom: 0.75em;
      font-style: normal;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-brand-500 selection:text-white h-dvh flex flex-col overflow-hidden">

  <!-- APP ROOT CONTAINER -->
  <div id="app" class="relative w-full h-dvh flex flex-col overflow-hidden bg-slate-950">

    <!-- TOP HEADER NAVBAR -->
    <header id="top-nav" class="shrink-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 pt-safe">
      <div class="flex items-center justify-between px-4 h-14 max-w-5xl mx-auto">
        <div class="flex items-center gap-2 cursor-pointer" id="btn-brand-home">
          <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-brand-500/30">
            L
          </div>
          <span class="font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-200 to-slate-400 text-lg">LUMINA</span>
        </div>

        <div class="flex items-center gap-1">
          <!-- Reader Specific Quick Controls -->
          <button id="btn-toc" class="hidden p-2 rounded-lg hover:bg-slate-800 text-slate-300 hover:text-white transition-colors" title="목차">
            <i data-lucide="list"></i>
          </button>
          <button id="btn-reader-style" class="hidden p-2 rounded-lg hover:bg-slate-800 text-slate-300 hover:text-white transition-colors" title="보기 설정">
            <i data-lucide="type"></i>
          </button>
          <button id="btn-tts" class="hidden p-2 rounded-lg hover:bg-slate-800 text-slate-300 hover:text-white transition-colors" title="음성 읽기 (TTS)">
            <i data-lucide="volume-2"></i>
          </button>
          <button id="btn-file-import" class="p-2 rounded-lg bg-brand-600/20 hover:bg-brand-600/30 text-brand-400 hover:text-brand-300 border border-brand-500/30 transition-all text-sm font-medium flex items-center gap-1.5 px-3">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span class="hidden sm:inline">책 열기</span>
          </button>
        </div>
      </div>
    </header>

    <!-- HIDDEN FILE INPUT -->
    <input type="file" id="file-input" accept=".txt,.epub,.pdf,.docx" class="hidden" />

    <!-- MAIN CONTENT VIEW AREA -->
    <main class="flex-1 relative w-full h-full min-h-0 overflow-hidden bg-slate-950 flex flex-col">
      
      <!-- VIEW 1: HOME / WELCOME DASHBOARD -->
      <section id="view-home" class="w-full h-full scrollable-y flex flex-col items-center justify-center px-6 text-center py-10">
        <div class="max-w-md mx-auto flex flex-col items-center my-auto">
          <div class="w-20 h-20 rounded-3xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center text-white font-black text-4xl shadow-2xl shadow-brand-500/30 mb-6 animate-pulse">
            L
          </div>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-white mb-3 tracking-tight">몰입을 위한 최적의 독서 공간</h1>
          <p class="text-sm sm:text-base text-slate-400 mb-8 leading-relaxed">
            TXT, EPUB, PDF, DOCX 파일의 깔끔한 단락 구분과 한글 목차 파싱으로 한 단계 더 완벽해진 독서를 경험해보세요.
          </p>

          <div class="flex flex-col w-full gap-3">
            <button id="btn-home-library" class="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-semibold shadow-lg shadow-brand-600/30 transition-all flex items-center justify-center gap-2">
              <i data-lucide="book-open" class="w-5 h-5"></i>
              내 서재로 이동
            </button>
            <button id="btn-home-import" class="w-full py-3.5 px-6 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold transition-all flex items-center justify-center gap-2">
              <i data-lucide="file-plus" class="w-5 h-5"></i>
              새 파일 바로 읽기
            </button>
          </div>

          <div class="mt-8 text-xs text-slate-500 font-mono">
            Lumina Reader v2.7 • Private Local Storage
          </div>
        </div>
      </section>

      <!-- VIEW 2: MY LIBRARY -->
      <section id="view-library" class="hidden w-full h-full flex-col max-w-5xl mx-auto p-4 sm:p-6 overflow-hidden">
        <!-- Library Tabs & Header -->
        <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-3 shrink-0">
          <h2 class="text-xl font-bold text-white flex items-center gap-2">
            <i data-lucide="library" class="text-brand-500"></i> 내 서재
          </h2>
          <div class="flex gap-1 bg-slate-900 p-1 rounded-lg border border-slate-800">
            <button id="tab-lib-reading" class="px-3 py-1.5 text-xs sm:text-sm font-medium rounded-md bg-brand-600 text-white transition-all">읽는 중</button>
            <button id="tab-lib-completed" class="px-3 py-1.5 text-xs sm:text-sm font-medium rounded-md text-slate-400 hover:text-white transition-all">완독</button>
          </div>
        </div>

        <!-- Book List Container -->
        <div id="library-book-grid" class="flex-1 scrollable-y grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 pr-1 pb-6">
          <!-- Dynamic Book Cards Injected Here -->
        </div>

        <!-- Empty State -->
        <div id="library-empty" class="hidden flex-1 flex flex-col items-center justify-center text-slate-500 py-12">
          <i data-lucide="book-x" class="w-16 h-16 stroke-1 mb-3 text-slate-600"></i>
          <p class="text-base font-medium">저장된 도서가 없습니다.</p>
          <p class="text-xs text-slate-600 mt-1">상단의 '책 열기' 버튼을 눌러 도서를 추가해보세요.</p>
        </div>
      </section>

      <!-- VIEW 3: IMMERSIVE READER -->
      <section id="view-reader" class="hidden w-full h-full flex-col relative overflow-hidden bg-slate-900 reader-theme-dark">
        
        <!-- Reader Scroll Engine Window -->
        <div id="reader-scroll-container" class="flex-1 w-full h-full scrollable-y px-4 sm:px-8 py-8 transition-colors duration-200">
          <div id="reader-content-wrapper" class="max-w-2xl mx-auto leading-relaxed transition-all duration-200 pb-20">
            <!-- Book HTML Content Rendered Here -->
          </div>
        </div>

        <!-- Floating Quick Scroll Jump / Progress Overlay -->
        <div id="reader-progress-bar-container" class="absolute bottom-0 left-0 right-0 h-1 bg-slate-800/50 z-20">
          <div id="reader-progress-bar-fill" class="h-full bg-brand-500 transition-all duration-150" style="width: 0%;"></div>
        </div>

      </section>

    </main>

    <!-- BOTTOM FLOATING FOOTER NAV -->
    <footer id="bottom-nav" class="shrink-0 z-30 bg-slate-900/95 backdrop-blur-md border-t border-slate-800/80 pb-safe">
      <div class="flex items-center justify-around h-14 max-w-md mx-auto px-2">
        <button id="nav-btn-home" class="flex flex-col items-center justify-center w-16 h-full text-brand-400 transition-colors">
          <i data-lucide="home" class="w-5 h-5"></i>
          <span class="text-[10px] mt-1 font-medium">홈</span>
        </button>
        <button id="nav-btn-library" class="flex flex-col items-center justify-center w-16 h-full text-slate-400 hover:text-slate-200 transition-colors">
          <i data-lucide="book-marked" class="w-5 h-5"></i>
          <span class="text-[10px] mt-1 font-medium">서재</span>
        </button>
        <button id="nav-btn-reader" class="flex flex-col items-center justify-center w-16 h-full text-slate-400 hover:text-slate-200 transition-colors">
          <i data-lucide="book-open-check" class="w-5 h-5"></i>
          <span class="text-[10px] mt-1 font-medium">리더</span>
        </button>
      </div>
    </footer>

    <!-- MODAL 1: TABLE OF CONTENTS (TOC) DRAWER -->
    <div id="modal-toc" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden transition-opacity">
      <div class="absolute right-0 top-0 bottom-0 w-80 max-w-[85vw] bg-slate-900 border-l border-slate-800 flex flex-col p-4 shadow-2xl">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-3">
          <h3 class="font-bold text-white flex items-center gap-2">
            <i data-lucide="list" class="w-4 h-4 text-brand-500"></i> 목차
          </h3>
          <button id="btn-close-toc" class="p-1 rounded-lg text-slate-400 hover:text-white">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
        <div id="toc-list-container" class="flex-1 scrollable-y space-y-1 pr-1 text-sm">
          <!-- Dynamic Chapter Anchors -->
        </div>
      </div>
    </div>

    <!-- MODAL 2: READER DISPLAY SETTINGS -->
    <div id="modal-settings" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div class="w-full sm:max-w-md bg-slate-900 border-t sm:border border-slate-800 rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl space-y-5 pb-safe max-h-[90dvh] scrollable-y">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
          <h3 class="font-bold text-white flex items-center gap-2">
            <i data-lucide="sliders" class="w-4 h-4 text-brand-500"></i> 독서 환경 설정
          </h3>
          <button id="btn-close-settings" class="p-1 rounded-lg text-slate-400 hover:text-white">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <!-- Font Size Slider -->
        <div class="space-y-2">
          <div class="flex justify-between text-xs text-slate-400">
            <span>글꼴 크기</span>
            <span id="label-font-size">18px</span>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-xs font-bold">A-</span>
            <input type="range" id="input-font-size" min="14" max="32" value="18" class="w-full accent-brand-500 h-1.5 bg-slate-800 rounded-lg cursor-pointer">
            <span class="text-base font-bold">A+</span>
          </div>
        </div>

        <!-- Font Line Height & Letter Spacing -->
        <div class="grid grid-cols-2 gap-3">
          <div class="space-y-1">
            <label class="text-xs text-slate-400">줄 간격</label>
            <select id="select-line-height" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200">
              <option value="1.5">좁게 (1.5)</option>
              <option value="1.8" selected>보통 (1.8)</option>
              <option value="2.1">넓게 (2.1)</option>
            </select>
          </div>
          <div class="space-y-1">
            <label class="text-xs text-slate-400">자간</label>
            <select id="select-letter-spacing" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200">
              <option value="-0.02em">좁게</option>
              <option value="0" selected>보통</option>
              <option value="0.05em">넓게</option>
            </select>
          </div>
        </div>

        <!-- Web Fonts Selection -->
        <div class="space-y-1.5">
          <label class="text-xs text-slate-400">글꼴 종류</label>
          <div class="grid grid-cols-3 gap-2">
            <button data-font="font-myeongjo" class="btn-font-choice py-2 rounded-lg border text-xs font-myeongjo bg-slate-800 border-brand-500 text-white">나눔명조</button>
            <button data-font="font-batang" class="btn-font-choice py-2 rounded-lg border border-slate-700 text-xs font-batang text-slate-400 hover:text-white">고운바탕</button>
            <button data-font="font-serifkr" class="btn-font-choice py-2 rounded-lg border border-slate-700 text-xs font-serifkr text-slate-400 hover:text-white">노토서리프</button>
          </div>
        </div>

        <!-- Color Theme Selectors -->
        <div class="space-y-1.5">
          <label class="text-xs text-slate-400">테마 색상</label>
          <div class="grid grid-cols-4 gap-2">
            <button data-theme="dark" class="btn-theme-choice p-2 rounded-lg border border-brand-500 bg-slate-900 text-slate-200 text-xs flex flex-col items-center gap-1">
              <span class="w-4 h-4 rounded-full bg-slate-950 border border-slate-700"></span> 다크
            </button>
            <button data-theme="sepia" class="btn-theme-choice p-2 rounded-lg border border-slate-700 bg-sepia-base text-sepia-text text-xs flex flex-col items-center gap-1">
              <span class="w-4 h-4 rounded-full bg-[#fbf0d9] border border-amber-300"></span> 세피아
            </button>
            <button data-theme="light" class="btn-theme-choice p-2 rounded-lg border border-slate-700 bg-white text-slate-900 text-xs flex flex-col items-center gap-1">
              <span class="w-4 h-4 rounded-full bg-white border border-slate-300"></span> 라이트
            </button>
            <button data-theme="black" class="btn-theme-choice p-2 rounded-lg border border-slate-700 bg-black text-neutral-400 text-xs flex flex-col items-center gap-1">
              <span class="w-4 h-4 rounded-full bg-black border border-neutral-800"></span> 블랙
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- MODAL 3: NATIVE SYSTEM TTS CONTROLLER -->
    <div id="modal-tts" class="fixed bottom-16 left-1/2 -translate-x-1/2 z-40 bg-slate-900/95 border border-slate-700 rounded-2xl p-3 shadow-2xl backdrop-blur-md hidden w-[90%] max-w-sm">
      <div class="flex items-center justify-between gap-3">
        <button id="btn-tts-play" class="w-10 h-10 rounded-xl bg-brand-600 text-white flex items-center justify-center hover:bg-brand-500">
          <i data-lucide="play" class="w-5 h-5 fill-current"></i>
        </button>
        <div class="flex-1 min-w-0">
          <div class="text-xs font-semibold text-slate-200 truncate" id="tts-status">음성 읽기 대기 중</div>
          <div class="text-[10px] text-slate-400">속도: <span id="label-tts-rate">1.0</span>x</div>
        </div>
        <input type="range" id="input-tts-rate" min="0.7" max="1.8" step="0.1" value="1.0" class="w-20 accent-brand-500 h-1 bg-slate-800">
        <button id="btn-close-tts" class="p-1 rounded-lg text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- LOADING OVERLAY -->
    <div id="loading-overlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center hidden">
      <div class="w-12 h-12 border-4 border-brand-500/20 border-t-brand-500 rounded-full animate-spin mb-3"></div>
      <p id="loading-text" class="text-sm font-medium text-slate-200">파일 분석 및 변환 중...</p>
    </div>

  </div>

  <!-- APPLICATION LOGIC -->
  <script>
    // Global Application State Store
    const App = {
      books: [], // List of book objects saved in localStorage
      currentBookId: null,
      currentChapterIndex: 0,
      readerSettings: {
        fontSize: 18,
        lineHeight: 1.8,
        letterSpacing: '0em',
        fontFamily: 'font-myeongjo',
        theme: 'dark'
      },
      tts: {
        synth: window.speechSynthesis,
        utterance: null,
        isPlaying: false,
        rate: 1.0
      },
      activeTab: 'reading' // 'reading' | 'completed'
    };

    // DOM Elements Cache
    const DOM = {
      fileInput: document.getElementById('file-input'),
      btnFileImport: document.getElementById('btn-file-import'),
      btnBrandHome: document.getElementById('btn-brand-home'),
      
      // Views
      viewHome: document.getElementById('view-home'),
      viewLibrary: document.getElementById('view-library'),
      viewReader: document.getElementById('view-reader'),

      // Nav Buttons
      navHome: document.getElementById('nav-btn-home'),
      navLibrary: document.getElementById('nav-btn-library'),
      navReader: document.getElementById('nav-btn-reader'),
      btnHomeLibrary: document.getElementById('btn-home-library'),
      btnHomeImport: document.getElementById('btn-home-import'),

      // Header Bar Buttons
      topNav: document.getElementById('top-nav'),
      bottomNav: document.getElementById('bottom-nav'),
      btnToc: document.getElementById('btn-toc'),
      btnReaderStyle: document.getElementById('btn-reader-style'),
      btnTts: document.getElementById('btn-tts'),

      // Library Elements
      libraryGrid: document.getElementById('library-book-grid'),
      libraryEmpty: document.getElementById('library-empty'),
      tabLibReading: document.getElementById('tab-lib-reading'),
      tabLibCompleted: document.getElementById('tab-lib-completed'),

      // Reader Elements
      scrollContainer: document.getElementById('reader-scroll-container'),
      contentWrapper: document.getElementById('reader-content-wrapper'),
      progressFill: document.getElementById('reader-progress-bar-fill'),

      // Modals
      modalToc: document.getElementById('modal-toc'),
      btnCloseToc: document.getElementById('btn-close-toc'),
      tocListContainer: document.getElementById('toc-list-container'),

      modalSettings: document.getElementById('modal-settings'),
      btnCloseSettings: document.getElementById('btn-close-settings'),
      inputFontSize: document.getElementById('input-font-size'),
      labelFontSize: document.getElementById('label-font-size'),
      selectLineHeight: document.getElementById('select-line-height'),
      selectLetterSpacing: document.getElementById('select-letter-spacing'),

      modalTts: document.getElementById('modal-tts'),
      btnTtsPlay: document.getElementById('btn-tts-play'),
      btnCloseTts: document.getElementById('btn-close-tts'),
      labelTtsRate: document.getElementById('label-tts-rate'),
      inputTtsRate: document.getElementById('input-tts-rate'),
      ttsStatus: document.getElementById('tts-status'),

      loadingOverlay: document.getElementById('loading-overlay'),
      loadingText: document.getElementById('loading-text')
    };

    // Initialize App
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      loadStoredData();
      bindEvents();
      renderLibrary();
      applyReaderSettings();
    });

    // -------------------------------------------------------------
    // LOCAL STORAGE MANAGEMENT
    // -------------------------------------------------------------
    function loadStoredData() {
      try {
        const savedBooks = localStorage.getItem('lumina_books');
        if (savedBooks) App.books = JSON.parse(savedBooks);

        const savedSettings = localStorage.getItem('lumina_settings');
        if (savedSettings) App.readerSettings = { ...App.readerSettings, ...JSON.parse(savedSettings) };
      } catch (e) {
        console.error("Failed to load local storage data", e);
      }
    }

    function saveBooksToStorage() {
      try {
        localStorage.setItem('lumina_books', JSON.stringify(App.books));
      } catch (e) {
        console.warn("Storage quota exceeded or error saving books", e);
      }
    }

    function saveSettingsToStorage() {
      try {
        localStorage.setItem('lumina_settings', JSON.stringify(App.readerSettings));
      } catch (e) {
        console.error("Error saving settings", e);
      }
    }

    // -------------------------------------------------------------
    // NAVIGATION & VIEW SWITCHING (RELIABLE SCROLL-SAFE TRANSITIONS)
    // -------------------------------------------------------------
    function switchView(viewName) {
      DOM.viewHome.classList.add('hidden');
      DOM.viewHome.classList.remove('flex');

      DOM.viewLibrary.classList.add('hidden');
      DOM.viewLibrary.classList.remove('flex');

      DOM.viewReader.classList.add('hidden');
      DOM.viewReader.classList.remove('flex');

      DOM.btnToc.classList.add('hidden');
      DOM.btnReaderStyle.classList.add('hidden');
      DOM.btnTts.classList.add('hidden');

      // Reset Nav Active Classes
      [DOM.navHome, DOM.navLibrary, DOM.navReader].forEach(btn => {
        btn.classList.remove('text-brand-400');
        btn.classList.add('text-slate-400');
      });

      if (viewName === 'home') {
        DOM.viewHome.classList.remove('hidden');
        DOM.viewHome.classList.add('flex');
        DOM.navHome.classList.add('text-brand-400');
      } else if (viewName === 'library') {
        DOM.viewLibrary.classList.remove('hidden');
        DOM.viewLibrary.classList.add('flex');
        DOM.navLibrary.classList.add('text-brand-400');
        renderLibrary();
      } else if (viewName === 'reader') {
        DOM.viewReader.classList.remove('hidden');
        DOM.viewReader.classList.add('flex');
        DOM.navReader.classList.add('text-brand-400');

        DOM.btnToc.classList.remove('hidden');
        DOM.btnReaderStyle.classList.remove('hidden');
        DOM.btnTts.classList.remove('hidden');
      }
    }

    // -------------------------------------------------------------
    // FILE PARSER ENGINE
    // -------------------------------------------------------------
    function bindEvents() {
      DOM.btnFileImport.addEventListener('click', () => DOM.fileInput.click());
      DOM.btnHomeImport.addEventListener('click', () => DOM.fileInput.click());
      DOM.fileInput.addEventListener('change', handleFileSelect);

      DOM.btnBrandHome.addEventListener('click', () => switchView('home'));
      DOM.navHome.addEventListener('click', () => switchView('home'));
      DOM.navLibrary.addEventListener('click', () => switchView('library'));
      DOM.btnHomeLibrary.addEventListener('click', () => switchView('library'));
      DOM.navReader.addEventListener('click', () => {
        if (App.currentBookId) switchView('reader');
        else alert('읽을 도서를 선택하거나 먼저 파일(.txt, .epub, .pdf, .docx)을 열어주세요.');
      });

      // Library Tabs
      DOM.tabLibReading.addEventListener('click', () => {
        App.activeTab = 'reading';
        DOM.tabLibReading.className = 'px-3 py-1.5 text-xs sm:text-sm font-medium rounded-md bg-brand-600 text-white transition-all';
        DOM.tabLibCompleted.className = 'px-3 py-1.5 text-xs sm:text-sm font-medium rounded-md text-slate-400 hover:text-white transition-all';
        renderLibrary();
      });
      DOM.tabLibCompleted.addEventListener('click', () => {
        App.activeTab = 'completed';
        DOM.tabLibCompleted.className = 'px-3 py-1.5 text-xs sm:text-sm font-medium rounded-md bg-brand-600 text-white transition-all';
        DOM.tabLibReading.className = 'px-3 py-1.5 text-xs sm:text-sm font-medium rounded-md text-slate-400 hover:text-white transition-all';
        renderLibrary();
      });

      // Reader Scroll & Progress Calculation
      DOM.scrollContainer.addEventListener('scroll', updateReadingProgress, { passive: true });

      // Reader Controls
      DOM.btnToc.addEventListener('click', () => DOM.modalToc.classList.remove('hidden'));
      DOM.btnCloseToc.addEventListener('click', () => DOM.modalToc.classList.add('hidden'));

      DOM.btnReaderStyle.addEventListener('click', () => DOM.modalSettings.classList.remove('hidden'));
      DOM.btnCloseSettings.addEventListener('click', () => DOM.modalSettings.classList.add('hidden'));

      // Style Setting Changes
      DOM.inputFontSize.addEventListener('input', (e) => {
        App.readerSettings.fontSize = parseInt(e.target.value);
        DOM.labelFontSize.textContent = `${App.readerSettings.fontSize}px`;
        applyReaderSettings();
        saveSettingsToStorage();
      });

      DOM.selectLineHeight.addEventListener('change', (e) => {
        App.readerSettings.lineHeight = parseFloat(e.target.value);
        applyReaderSettings();
        saveSettingsToStorage();
      });

      DOM.selectLetterSpacing.addEventListener('change', (e) => {
        App.readerSettings.letterSpacing = e.target.value;
        applyReaderSettings();
        saveSettingsToStorage();
      });

      document.querySelectorAll('.btn-font-choice').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.btn-font-choice').forEach(b => {
            b.classList.remove('border-brand-500', 'text-white');
            b.classList.add('border-slate-700', 'text-slate-400');
          });
          btn.classList.add('border-brand-500', 'text-white');
          btn.classList.remove('border-slate-700', 'text-slate-400');

          App.readerSettings.fontFamily = btn.dataset.font;
          applyReaderSettings();
          saveSettingsToStorage();
        });
      });

      document.querySelectorAll('.btn-theme-choice').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.btn-theme-choice').forEach(b => b.classList.remove('border-brand-500'));
          btn.classList.add('border-brand-500');

          App.readerSettings.theme = btn.dataset.theme;
          applyReaderSettings();
          saveSettingsToStorage();
        });
      });

      // TTS Controls
      DOM.btnTts.addEventListener('click', toggleTtsModal);
      DOM.btnCloseTts.addEventListener('click', () => DOM.modalTts.classList.add('hidden'));
      DOM.btnTtsPlay.addEventListener('click', handleTtsPlayPause);
      DOM.inputTtsRate.addEventListener('input', (e) => {
        App.tts.rate = parseFloat(e.target.value);
        DOM.labelTtsRate.textContent = App.tts.rate.toFixed(1);
      });
    }

    async function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      showLoading(`'${file.name}' 파일을 읽고 파싱하는 중...`);

      try {
        const ext = file.name.split('.').pop().toLowerCase();
        let parsedResult = { title: file.name.replace(/\.[^/.]+$/, ""), rawText: "", htmlContent: "", chapters: [] };

        if (ext === 'txt') {
          const text = await file.text();
          parsedResult = parseTxtContent(text, parsedResult.title);
        } else if (ext === 'docx') {
          parsedResult = await parseDocxContent(file, parsedResult.title);
        } else if (ext === 'pdf') {
          parsedResult = await parsePdfContent(file, parsedResult.title);
        } else if (ext === 'epub') {
          parsedResult = await parseEpubContent(file, parsedResult.title);
        } else {
          throw new Error('지원하지 않는 파일 형식입니다.');
        }

        // Add to book storage
        const newBook = {
          id: 'book_' + Date.now(),
          title: parsedResult.title,
          fileType: ext.toUpperCase(),
          htmlContent: parsedResult.htmlContent,
          chapters: parsedResult.chapters,
          progress: 0,
          scrollTop: 0,
          dateAdded: new Date().toLocaleDateString('ko-KR')
        };

        App.books.unshift(newBook);
        saveBooksToStorage();

        // Immediately Open Book in Reader
        openBook(newBook.id);

      } catch (err) {
        console.error(err);
        alert('파일을 읽는 중 오류가 발생했습니다: ' + err.message);
      } finally {
        hideLoading();
        DOM.fileInput.value = '';
      }
    }

    // Helper: HTML Clean / DOM Structural Extractor into Proper Lines
    function cleanAndStructureHtml(rawHtml) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(rawHtml, 'text/html');

      const blocks = doc.querySelectorAll('p, div, h1, h2, h3, h4, h5, h6, br, li, blockquote');
      blocks.forEach(el => {
        if (el.tagName.toLowerCase() === 'br') {
          el.replaceWith('\n');
        } else {
          el.prepend(doc.createTextNode('\n'));
          el.append(doc.createTextNode('\n'));
        }
      });

      return doc.body.textContent || '';
    }

    // Helper: Korean Chapter & Header Detection Engine
    function parseTextIntoStructuredChapters(rawText, title) {
      const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
      const chapterRegex = /^(제\s*\d+\s*[장화부편]|chapter\s*\d+|\d+\s*화|\d+\s*장|#[^\n]+|\d+\.\s+[^\n]+)/i;

      let chapters = [];
      let currentChapter = { title: "서두 / 시작", lines: [], id: "chap_0" };
      let formattedHtmlArr = [];

      lines.forEach((line) => {
        const safeLine = line.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

        if (chapterRegex.test(line) && line.length < 60) {
          if (currentChapter.lines.length > 0) {
            chapters.push(currentChapter);
          }
          const chapId = `chap_${chapters.length}`;
          currentChapter = { title: line, lines: [], id: chapId };

          formattedHtmlArr.push(`<h2 id="${chapId}" class="reader-heading text-xl font-bold">${safeLine}</h2>`);
        } else if (line.startsWith('"') || line.startsWith('“') || line.startsWith("'")) {
          formattedHtmlArr.push(`<p class="reader-paragraph reader-dialogue">${safeLine}</p>`);
          currentChapter.lines.push(line);
        } else {
          formattedHtmlArr.push(`<p class="reader-paragraph">${safeLine}</p>`);
          currentChapter.lines.push(line);
        }
      });

      if (currentChapter.lines.length > 0) {
        chapters.push(currentChapter);
      }

      if (chapters.length === 0) {
        chapters.push({ title: "전체 본문", lines: lines, id: "chap_0" });
      }

      return {
        title,
        htmlContent: formattedHtmlArr.join('\n'),
        chapters: chapters.map(c => ({ id: c.id, title: c.title }))
      };
    }

    // 1. TXT Parser
    function parseTxtContent(text, title) {
      return parseTextIntoStructuredChapters(text, title);
    }

    // 2. DOCX Parser
    async function parseDocxContent(file, title) {
      const arrayBuffer = await file.arrayBuffer();
      const result = await mammoth.convertToHtml({ arrayBuffer: arrayBuffer });
      const structuredText = cleanAndStructureHtml(result.value);
      return parseTextIntoStructuredChapters(structuredText, title);
    }

    // 3. PDF Parser
    async function parsePdfContent(file, title) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let fullText = '';

      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const textContent = await page.getTextContent();
        const pageText = textContent.items.map(item => item.str).join(' ');
        fullText += pageText + '\n\n';
      }

      return parseTextIntoStructuredChapters(fullText, title);
    }

    // 4. EPUB Parser
    async function parseEpubContent(file, title) {
      const arrayBuffer = await file.arrayBuffer();
      const book = ePub(arrayBuffer);
      await book.ready;

      let combinedText = '';
      const spine = book.spine;

      for (const item of spine.items) {
        try {
          const doc = await book.load(item.href);
          if (doc) {
            let extracted = '';
            if (typeof doc === 'string') {
              extracted = cleanAndStructureHtml(doc);
            } else if (doc.body) {
              extracted = cleanAndStructureHtml(doc.body.innerHTML);
            }
            combinedText += extracted + '\n\n';
          }
        } catch (e) {
          console.warn('Error loading EPUB chapter segment', e);
        }
      }

      return parseTextIntoStructuredChapters(combinedText, title);
    }

    // -------------------------------------------------------------
    // LIBRARY VIEW RENDER & MANAGEMENT
    // -------------------------------------------------------------
    function renderLibrary() {
      DOM.libraryGrid.innerHTML = '';

      const filteredBooks = App.books.filter(b => {
        if (App.activeTab === 'reading') return (b.progress || 0) < 95;
        return (b.progress || 0) >= 95;
      });

      if (filteredBooks.length === 0) {
        DOM.libraryEmpty.classList.remove('hidden');
        DOM.libraryGrid.classList.add('hidden');
        return;
      }

      DOM.libraryEmpty.classList.add('hidden');
      DOM.libraryGrid.classList.remove('hidden');

      filteredBooks.forEach(book => {
        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800 hover:border-brand-500/50 rounded-2xl p-4 flex flex-col justify-between transition-all hover:shadow-lg hover:shadow-brand-500/10 group cursor-pointer";
        
        const progressPercent = Math.min(100, Math.max(0, Math.round(book.progress || 0)));

        card.innerHTML = `
          <div>
            <div class="flex items-start justify-between gap-2 mb-2">
              <span class="px-2 py-0.5 text-[10px] font-bold rounded bg-brand-500/20 text-brand-400 border border-brand-500/30">${book.fileType}</span>
              <button class="btn-delete-book text-slate-500 hover:text-rose-400 p-1 transition-colors" data-id="${book.id}" title="삭제">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
            <h3 class="font-bold text-slate-100 group-hover:text-brand-300 transition-colors line-clamp-2 text-base leading-snug mb-1">${book.title}</h3>
            <p class="text-xs text-slate-500 mb-4">등록일: ${book.dateAdded}</p>
          </div>

          <div>
            <div class="flex items-center justify-between text-xs text-slate-400 mb-1.5 font-mono">
              <span>진도율</span>
              <span class="font-bold text-brand-400">${progressPercent}%</span>
            </div>
            <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
              <div class="h-full bg-gradient-to-r from-brand-600 to-indigo-400 rounded-full" style="width: ${progressPercent}%"></div>
            </div>
          </div>
        `;

        card.addEventListener('click', (e) => {
          if (e.target.closest('.btn-delete-book')) return;
          openBook(book.id);
        });

        const deleteBtn = card.querySelector('.btn-delete-book');
        deleteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (confirm(`'${book.title}' 도서를 서재에서 삭제하시겠습니까?`)) {
            App.books = App.books.filter(b => b.id !== book.id);
            saveBooksToStorage();
            renderLibrary();
          }
        });

        DOM.libraryGrid.appendChild(card);
      });

      lucide.createIcons();
    }

    // -------------------------------------------------------------
    // READER ENGINE & PROGRESS CALCULATION
    // -------------------------------------------------------------
    function openBook(bookId) {
      const book = App.books.find(b => b.id === bookId);
      if (!book) return;

      App.currentBookId = bookId;

      // Inject Content
      DOM.contentWrapper.innerHTML = book.htmlContent || '<p class="text-slate-500">본문 내용이 없습니다.</p>';

      // Populate TOC List
      renderTocList(book.chapters || []);

      // Switch to Reader View
      switchView('reader');

      // Restore Scroll Position
      requestAnimationFrame(() => {
        setTimeout(() => {
          if (book.scrollTop && book.scrollTop > 0) {
            DOM.scrollContainer.scrollTop = book.scrollTop;
          } else {
            DOM.scrollContainer.scrollTop = 0;
          }
          updateReadingProgress();
        }, 50);
      });
    }

    function renderTocList(chapters) {
      DOM.tocListContainer.innerHTML = '';

      if (!chapters || chapters.length === 0) {
        DOM.tocListContainer.innerHTML = '<p class="text-xs text-slate-500 py-4 text-center">감지된 목차가 없습니다.</p>';
        return;
      }

      chapters.forEach((chap) => {
        const item = document.createElement('button');
        item.className = "w-full text-left py-2 px-3 rounded-lg hover:bg-slate-800 text-slate-300 hover:text-white transition-colors text-xs truncate border-b border-slate-800/50";
        item.textContent = chap.title;

        item.addEventListener('click', () => {
          const targetEl = document.getElementById(chap.id);
          if (targetEl) {
            targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
            DOM.modalToc.classList.add('hidden');
          }
        });

        DOM.tocListContainer.appendChild(item);
      });
    }

    function updateReadingProgress() {
      if (!App.currentBookId) return;

      const container = DOM.scrollContainer;
      const scrollTop = container.scrollTop;
      const scrollHeight = container.scrollHeight - container.clientHeight;

      let progress = 0;
      if (scrollHeight > 0) {
        progress = (scrollTop / scrollHeight) * 100;
      }

      progress = Math.min(100, Math.max(0, progress));

      // Update Visual Progress Fill
      DOM.progressFill.style.width = `${progress}%`;

      // Sync with Book State in Array
      const book = App.books.find(b => b.id === App.currentBookId);
      if (book) {
        book.progress = progress;
        book.scrollTop = scrollTop;
        saveBooksToStorage();
      }
    }

    // -------------------------------------------------------------
    // DISPLAY & TYPOGRAPHY SETTINGS APPLIER
    // -------------------------------------------------------------
    function applyReaderSettings() {
      const s = App.readerSettings;
      const wrapper = DOM.contentWrapper;
      const container = DOM.scrollContainer;

      // Font Size
      wrapper.style.fontSize = `${s.fontSize}px`;
      DOM.inputFontSize.value = s.fontSize;
      DOM.labelFontSize.textContent = `${s.fontSize}px`;

      // Line Height & Letter Spacing
      wrapper.style.lineHeight = s.lineHeight;
      DOM.selectLineHeight.value = s.lineHeight;

      wrapper.style.letterSpacing = s.letterSpacing;
      DOM.selectLetterSpacing.value = s.letterSpacing;

      // Font Family
      wrapper.classList.remove('font-myeongjo', 'font-batang', 'font-serifkr');
      wrapper.classList.add(s.fontFamily);

      // Theme Colors
      container.classList.remove('reader-theme-dark', 'reader-theme-light', 'reader-theme-sepia', 'reader-theme-black');
      container.classList.add(`reader-theme-${s.theme}`);
    }

    // -------------------------------------------------------------
    // NATIVE TTS SYSTEM CONTROLLER
    // -------------------------------------------------------------
    function toggleTtsModal() {
      if (DOM.modalTts.classList.contains('hidden')) {
        DOM.modalTts.classList.remove('hidden');
      } else {
        DOM.modalTts.classList.add('hidden');
        stopTts();
      }
    }

    function handleTtsPlayPause() {
      if (App.tts.isPlaying) {
        stopTts();
      } else {
        startTts();
      }
    }

    function startTts() {
      if (!App.tts.synth) {
        alert('이 브라우저는 음성 읽기(TTS)를 지원하지 않습니다.');
        return;
      }

      App.tts.synth.cancel();

      const textToRead = DOM.contentWrapper.innerText;
      if (!textToRead || textToRead.trim().length === 0) {
        alert('읽을 본문이 없습니다.');
        return;
      }

      const utterance = new SpeechSynthesisUtterance(textToRead.slice(0, 3000));
      utterance.lang = 'ko-KR';
      utterance.rate = App.tts.rate;

      utterance.onstart = () => {
        App.tts.isPlaying = true;
        DOM.ttsStatus.textContent = '음성 읽는 중...';
        DOM.btnTtsPlay.innerHTML = '<i data-lucide="pause" class="w-5 h-5 fill-current"></i>';
        lucide.createIcons();
      };

      utterance.onend = () => {
        stopTts();
      };

      utterance.onerror = () => {
        stopTts();
      };

      App.tts.utterance = utterance;
      App.tts.synth.speak(utterance);
    }

    function stopTts() {
      if (App.tts.synth) App.tts.synth.cancel();
      App.tts.isPlaying = false;
      DOM.ttsStatus.textContent = '음성 읽기 정지됨';
      DOM.btnTtsPlay.innerHTML = '<i data-lucide="play" class="w-5 h-5 fill-current"></i>';
      lucide.createIcons();
    }

    // Loader Utilities
    function showLoading(msg) {
      DOM.loadingText.textContent = msg || '처리 중...';
      DOM.loadingOverlay.classList.remove('hidden');
    }

    function hideLoading() {
      DOM.loadingOverlay.classList.add('hidden');
    }
  </script>
